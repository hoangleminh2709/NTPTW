<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <header>
        <div class="logo-container">
            <!-- SVG Inline: Logo đơn giản hình tròn và vuông -->
            <svg width="60" height="60" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                <rect x="10" y="10" width="80" height="80" fill="#3498db" rx="10" />
                <circle cx="50" cy="50" r="30" fill="white" />
                <text x="50" y="55" font-size="12" text-anchor="middle" fill="#2c3e50" font-family="Arial" font-weight="bold">TECH</text>
            </svg>
        </div>
        <h1>TechVision X1 - Tương Lai Trong Tầm Tay</h1>
        <p>Khám phá thế hệ thiết bị thông minh mới nhất</p>
    </header>

    <!-- Section 1: Hình ảnh sản phẩm -->
    <section>
        <h2>Bộ Sưu Tập Hình Ảnh</h2>
        <div class="gallery">
            <figure>
                <img src="https://images.unsplash.com/photo-1505740420928-5e560c06d30e?auto=format&fit=crop&w=400&q=80"
                     alt="Tai nghe chụp tai màu đen sang trọng"
                     loading="lazy">
                <figcaption>Hình 1: Thiết kế tai nghe công thái học với đệm da cao cấp.</figcaption>
            </figure>
            <figure>
                <img src="https://images.unsplash.com/photo-1523275335684-37898b6baf30?auto=format&fit=crop&w=400&q=80"
                     alt="Đồng hồ thông minh mặt tròn hiện đại"
                     loading="lazy">
                <figcaption>Hình 2: Smartwatch theo dõi sức khỏe 24/7.</figcaption>
            </figure>
            <figure>
                <img src="https://images.unsplash.com/photo-1491933382434-500287f9b54b?auto=format&fit=crop&w=400&q=80"
                     alt="Điện thoại thông minh camera cao cấp"
                     loading="lazy">
                <figcaption>Hình 3: Camera siêu sắc nét hỗ trợ quay phim 4K.</figcaption>
            </figure>
        </div>
    </section>

    <!-- Section 2: Video nhúng từ YouTube -->
    <section>
        <h2>Video Đánh Giá Chi Tiết (YouTube)</h2>
        <div class="video-container">
            <iframe
                src="https://www.youtube.com/embed/dQw4w9WgXcQ"
                title="YouTube video player"
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                allowfullscreen>
            </iframe>
        </div>
    </section>

    <!-- Section 3: Thẻ Video nội bộ -->
    <section>
        <h2>Video Demo Sản Phẩm</h2>
        <video controls poster="https://via.placeholder.com/800x450.png?text=Bấm+để+xem+Demo">
            <source src="https://www.w3schools.com/html/mov_bbb.mp4" type="video/mp4">
            <source src="https://www.w3schools.com/html/mov_bbb.webm" type="video/webm">
            Trình duyệt của bạn không hỗ trợ thẻ video.
        </video>
    </section>

    <!-- Section 4: Thẻ Audio -->
    <section>
        <h2>Nhạc Nền Giới Thiệu</h2>
        <div class="audio-section">
            <p>Nghe bản nhạc chủ đề của sản phẩm:</p>
            <audio controls>
                <source src="https://www.w3schools.com/html/horse.mp3" type="audio/mpeg">
                Trình duyệt của bạn không hỗ trợ thẻ audio.
            </audio>
        </div>
    </section>

    <footer style="text-align: center; margin-top: 40px; color: #888; font-size: 0.8em;">
        &copy; 2026 TLU Edu. All rights reserved.
    </footer>
</body>
</html>
